[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-uri-parse-pure"
version = "0.1.0"
description = "Zero-dependency pure-Python RFC 5870 geo: URI parser with WGS-84 bound validation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Prasad A Abhishek"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/prasad-a-abhishek/geo-uri-parse-pure"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geo_uri_parse_pure = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
